<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theology 6 Home Base</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">
<main class="homebase">
  <div id="loaderr"></div>

  <section class="hero" id="hero">
    <div class="hero-inner">
      <div class="hero-mark" id="heroMark"></div>
      <h1 data-edit data-bind="hero.title"></h1>
      <p data-edit data-bind="hero.subtitle"></p>
      <div class="rule"></div>
    </div>
  </section>
  <div id="heroTools"></div>

  <nav class="quicklinks" id="quicklinks" aria-label="Quick course links"></nav>

  <section class="grid">
    <article class="card">
      <h2 data-edit data-bind="main.heading"></h2>
      <div class="titleline"></div>
      <div id="announcements"></div>
    </article>

    <aside class="side">
      <section class="card week">
        <h3 data-edit data-bind="week.heading"></h3>
        <div class="titleline"></div>
        <ul id="weeklist"></ul>
      </section>

      <section class="card">
        <h3 data-edit data-bind="vision.heading"></h3>
        <div class="titleline"></div>
        <div class="vision" id="vision"></div>
      </section>
    </aside>
  </section>

  <footer class="quote" data-edit data-bind="quote"></footer>
</main>
<script src="assets/app.js"></script>
</body>
</html>
