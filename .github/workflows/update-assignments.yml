name: Update Blackbaud assignments

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and convert Blackbaud iCal
        env:
          BLACKBAUD_ICAL_URL: ${{ secrets.BLACKBAUD_ICAL_URL }}
        run: python scripts/update_assignments.py

      - name: Commit refreshed assignment data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assignments.json
          if git diff --cached --quiet; then
            echo "No assignment changes."
          else
            git commit -m "Refresh Blackbaud assignments"
            git push
          fi
