<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming Assignments</title>
<style>
:root{
  --bb-blue:#34495e;
  --bb-link:#2f5f8f;
  --bb-border:#d9dee3;
  --bb-soft:#f7f8fa;
  --bb-muted:#6f7c88;
  --bb-gold:#b48a3b;
  --bb-danger:#a23a32;
  --white:#fff;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:transparent;
  color:var(--bb-blue);
  font-family:Arial,Helvetica,sans-serif;
}
.wrap{
  width:100%;
  margin:0;
  padding:0;
}
.header{
  padding:0 0 10px 0;
  margin:0 0 2px 0;
  border-bottom:1px solid var(--bb-border);
}
.header h1{
  margin:0;
  font-size:20px;
  font-weight:700;
  color:var(--bb-blue);
}
.header p{
  margin:4px 0 0;
  font-size:12px;
  color:var(--bb-muted);
}
.list{
  width:100%;
}
.assignment{
  border-bottom:1px solid var(--bb-border);
  background:var(--white);
}
.assignment summary{
  list-style:none;
  cursor:pointer;
  padding:14px 6px 14px 2px;
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:14px;
}
.assignment summary::-webkit-details-marker{display:none}
.main{
  min-width:0;
}
.title{
  color:var(--bb-link);
  font-size:15px;
  font-weight:700;
  line-height:1.3;
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px 10px;
  align-items:center;
  margin-top:4px;
  font-size:12px;
  color:var(--bb-muted);
}
.course{
  color:var(--bb-blue);
}
.due{
  font-weight:700;
  color:var(--bb-blue);
}
.due.urgent{
  color:var(--bb-danger);
}
.points{
  color:var(--bb-muted);
}
.chev{
  font-size:18px;
  color:#8a949e;
  transition:transform .15s ease;
}
details[open] .chev{
  transform:rotate(90deg);
}
.details{
  background:var(--bb-soft);
  border-top:1px solid #edf0f2;
  padding:12px 12px 14px;
}
.detail-grid{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:6px 12px;
  font-size:13px;
  line-height:1.45;
}
.label{
  font-weight:700;
  color:var(--bb-blue);
}
.value{
  color:#465667;
}
.description{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #e2e6ea;
}
.description h3{
  margin:0 0 6px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--bb-gold);
}
.description p{
  margin:0;
  white-space:pre-wrap;
  font-size:13px;
  line-height:1.5;
  color:#465667;
}
.actions{
  margin-top:12px;
}
.actions a{
  display:inline-block;
  color:var(--bb-link);
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}
.actions a:hover{
  text-decoration:underline;
}
.empty,.error{
  padding:18px 2px;
  color:var(--bb-muted);
  font-size:13px;
}
.footer{
  padding:8px 0 0;
  color:var(--bb-muted);
  font-size:11px;
}
@media(max-width:560px){
  .assignment summary{
    padding:12px 4px 12px 0;
  }
  .detail-grid{
    grid-template-columns:1fr;
    gap:2px;
  }
  .label{
    margin-top:4px;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Upcoming Assignments</h1>
    <p id="subtitle">Loading upcoming work…</p>
  </div>

  <div id="list" class="list"></div>
  <div id="footer" class="footer"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const courseFilter = (params.get("course") || "").trim().toLowerCase();
const limit = Math.max(1, Math.min(20, Number(params.get("limit") || 6)));

const list = document.getElementById("list");
const subtitle = document.getElementById("subtitle");
const footer = document.getElementById("footer");

function esc(s=""){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function dt(iso){
  const d = new Date(iso);
  return new Intl.DateTimeFormat("en-US",{
    weekday:"long", month:"short", day:"numeric"
  }).format(d);
}

function shortDate(iso){
  const d = new Date(iso);
  return new Intl.DateTimeFormat("en-US",{
    month:"short", day:"numeric"
  }).format(d);
}

function dueLabel(iso){
  const d = new Date(iso);
  const now = new Date();
  const a = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const b = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff = Math.round((b-a)/86400000);

  if(diff < 0) return "Past due";
  if(diff === 0) return "Due today";
  if(diff === 1) return "Due tomorrow";
  return "Due " + shortDate(iso);
}

function getPoints(title){
  const m = String(title||"").match(/\((\d+(?:\.\d+)?)\)\s*$/);
  return m ? m[1] + " pts" : "";
}

function cleanTitle(title){
  let t = String(title || "Assignment");

  // Remove section/course prefix, e.g.:
  // "Theology 6 - 1: 8/26: HW Signed Syllabus (0.25)"
  // becomes "HW Signed Syllabus"
  t = t.replace(/^\s*Theology\s*[67]\s*-\s*\d+\s*:\s*/i, "");
  t = t.replace(/^\s*\d{1,2}\/\d{1,2}\s*:\s*/, "");

  // Remove trailing point value from the visible title.
  t = t.replace(/\s*\((\d+(?:\.\d+)?)\)\s*$/, "");

  return t.trim();
}

fetch("assignments.json?ts="+Date.now(), {cache:"no-store"})
  .then(r => {
    if(!r.ok) throw new Error("Could not load assignments.");
    return r.json();
  })
  .then(data => {
    let items = Array.isArray(data.assignments) ? data.assignments : [];

    if(courseFilter){
      items = items.filter(x => {
        const hay = [x.course,x.title,x.description,x.categories]
          .join(" ")
          .toLowerCase();
        return hay.includes(courseFilter);
      });
    }

    items = items
      .filter(x => x.due)
      .sort((a,b)=>new Date(a.due)-new Date(b.due))
      .slice(0,limit);

    subtitle.textContent = courseFilter
      ? `Showing the next ${items.length} assignment${items.length===1?"":"s"} for this class.`
      : `Showing the next ${items.length} assignment${items.length===1?"":"s"}.`;

    if(!items.length){
      list.innerHTML = '<div class="empty">No upcoming assignments found.</div>';
      footer.textContent = "";
      return;
    }

    list.innerHTML = items.map(x => {
      const label = dueLabel(x.due);
      const urgent = ["Due today","Due tomorrow","Past due"].includes(label) ? " urgent" : "";
      const points = getPoints(x.title);
      const course = x.course || "";
      const desc = x.description || "No additional assignment details were included in the calendar feed.";
      const openLink = x.url
        ? `<div class="actions"><a href="${esc(x.url)}" target="_blank" rel="noopener">Open assignment in Blackbaud →</a></div>`
        : "";

      return `
      <details class="assignment">
        <summary>
          <div class="main">
            <div class="title">${esc(cleanTitle(x.title))}</div>
            <div class="meta">
              ${course ? `<span class="course">${esc(course)}</span>` : ""}
              <span class="due${urgent}">${esc(label)}</span>
              ${points ? `<span class="points">${esc(points)}</span>` : ""}
            </div>
          </div>
          <div class="chev">›</div>
        </summary>

        <div class="details">
          <div class="detail-grid">
            <div class="label">Due</div>
            <div class="value">${esc(dt(x.due))}</div>
            ${course ? `<div class="label">Class</div><div class="value">${esc(course)}</div>` : ""}
            ${points ? `<div class="label">Points</div><div class="value">${esc(points)}</div>` : ""}
          </div>

          <div class="description">
            <h3>Assignment Details</h3>
            <p>${esc(desc)}</p>
          </div>

          ${openLink}
        </div>
      </details>`;
    }).join("");

    if(data.updated_at){
      const u = new Date(data.updated_at);
      footer.textContent = "Assignment feed updated " +
        new Intl.DateTimeFormat("en-US",{
          month:"short", day:"numeric", hour:"numeric", minute:"2-digit"
        }).format(u) + ".";
    } else {
      footer.textContent = "";
    }
  })
  .catch(err => {
    subtitle.textContent = "";
    list.innerHTML = `<div class="error">${esc(err.message)}</div>`;
  });
</script>
</body>
</html>
