<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignments</title>
<link rel="stylesheet" href="assignments.css">
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Assignments</h1>
    <p id="subtitle">Loading assignments…</p>
  </div>

  <div id="tabs" class="tabs" role="tablist"></div>
  <div id="list" class="list"></div>
  <div id="footer" class="footer"></div>
</div>

<script src="assignments.js"></script>
<script>
// ?course=Theology 6 - 1  → limit the page to one section
// ?limit=10               → cap the Upcoming list (default 6; "all" for no cap)
var params = new URLSearchParams(location.search);
var course = (params.get('course') || '').trim();
var rawLimit = (params.get('limit') || '').trim().toLowerCase();
var limit = rawLimit === 'all' ? 0 : Math.max(1, Math.min(50, Number(rawLimit) || 6));

if (course) {
  document.querySelector('.header h1').textContent = course;
}

Assignments.mount({
  dataUrl: 'assignments.json',
  section: course,
  showCourse: !course,
  limit: limit
});
Assignments.reportHeight();
</script>
</body>
</html>
