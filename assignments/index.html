<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcoming Assignments</title>
<style>
:root{
  --navy:#0b2f57;
  --navy2:#123f72;
  --gold:#c99a45;
  --cream:#fbfaf6;
  --ink:#23364b;
  --muted:#6f7b88;
  --line:#e7e4dc;
  --white:#fff;
  --danger:#a23a32;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:transparent;
  color:var(--ink);
}
.wrap{
  width:min(100%,980px);
  margin:0 auto;
  padding:8px;
}
.header{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:18px;
  margin:0 0 12px;
  padding:4px 2px 10px;
  border-bottom:2px solid var(--gold);
}
.header h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:28px;
  font-weight:500;
  color:var(--navy);
}
.header small{color:var(--muted)}
.list{display:grid;gap:10px}
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 7px rgba(26,43,62,.06);
}
.card summary{
  list-style:none;
  cursor:pointer;
  display:grid;
  grid-template-columns:72px 1fr auto;
  gap:14px;
  align-items:center;
  padding:14px 16px;
}
.card summary::-webkit-details-marker{display:none}
.datebox{
  background:var(--navy);
  color:white;
  border-radius:8px;
  text-align:center;
  padding:8px 6px;
  line-height:1;
}
.datebox .mon{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.datebox .day{font-size:25px;font-weight:700;margin-top:4px}
.title{font-family:Georgia,"Times New Roman",serif;font-size:19px;color:var(--navy);margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.badge{
  border:1px solid #d8c39d;
  background:#fffaf0;
  color:#795820;
  border-radius:999px;
  padding:3px 8px;
}
.due{font-size:12px;font-weight:700;color:var(--navy)}
.due.urgent{color:var(--danger)}
.chev{font-size:22px;color:#7b8792;transition:.2s}
details[open] .chev{transform:rotate(90deg)}
.details{
  border-top:1px solid var(--line);
  background:var(--cream);
  padding:16px 18px 18px 102px;
}
.details h3{
  margin:0 0 7px;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--gold);
}
.details .desc{
  white-space:pre-wrap;
  line-height:1.5;
  font-size:14px;
}
.actions{margin-top:14px}
.button{
  display:inline-block;
  text-decoration:none;
  background:var(--navy);
  color:white;
  border-radius:7px;
  padding:9px 12px;
  font-size:13px;
  font-weight:700;
}
.empty,.error{
  border:1px solid var(--line);
  border-radius:10px;
  padding:22px;
  background:white;
  text-align:center;
  color:var(--muted);
}
@media(max-width:600px){
  .card summary{grid-template-columns:60px 1fr 20px;padding:12px}
  .datebox .day{font-size:21px}
  .details{padding:14px}
  .header{align-items:start;flex-direction:column;gap:3px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Upcoming Assignments</h1>
    <small id="status">Loading…</small>
  </div>
  <div id="list" class="list"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const courseFilter = (params.get("course") || "").trim().toLowerCase();
const limit = Math.max(1, Math.min(20, Number(params.get("limit") || 6)));

const list = document.getElementById("list");
const status = document.getElementById("status");

function esc(s=""){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function localDate(iso){
  const d = new Date(iso);
  return new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric"}).format(d);
}
function month(iso){ return new Intl.DateTimeFormat("en-US",{month:"short"}).format(new Date(iso)); }
function day(iso){ return new Intl.DateTimeFormat("en-US",{day:"2-digit"}).format(new Date(iso)); }

function dueLabel(iso){
  const d = new Date(iso);
  const now = new Date();
  const a = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const b = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff = Math.round((b-a)/86400000);
  if(diff < 0) return "Past due";
  if(diff === 0) return "Due today";
  if(diff === 1) return "Due tomorrow";
  return "Due " + new Intl.DateTimeFormat("en-US",{weekday:"short",month:"short",day:"numeric"}).format(d);
}

fetch("assignments.json?ts="+Date.now(), {cache:"no-store"})
  .then(r => { if(!r.ok) throw new Error("Could not load assignments.json"); return r.json(); })
  .then(data => {
    let items = Array.isArray(data.assignments) ? data.assignments : [];
    if(courseFilter){
      items = items.filter(x => {
        const hay = [x.course,x.title,x.description,x.categories].join(" ").toLowerCase();
        return hay.includes(courseFilter);
      });
    }
    items = items
      .filter(x => x.due)
      .sort((a,b)=>new Date(a.due)-new Date(b.due))
      .slice(0,limit);

    status.textContent = data.updated_at ? "Updated " + localDate(data.updated_at) : "";

    if(!items.length){
      list.innerHTML = '<div class="empty">No upcoming assignments found.</div>';
      return;
    }

    list.innerHTML = items.map(x => {
      const label = dueLabel(x.due);
      const urgent = ["Due today","Due tomorrow","Past due"].includes(label) ? " urgent" : "";
      const course = x.course || x.categories || "";
      const desc = x.description || "No additional details were included in the Blackbaud calendar feed.";
      const link = x.url ? `<div class="actions"><a class="button" href="${esc(x.url)}" target="_blank" rel="noopener">Open in Blackbaud</a></div>` : "";
      return `
      <details class="card">
        <summary>
          <div class="datebox"><div class="mon">${esc(month(x.due))}</div><div class="day">${esc(day(x.due))}</div></div>
          <div>
            <div class="title">${esc(x.title || "Assignment")}</div>
            <div class="meta">
              ${course ? `<span class="badge">${esc(course)}</span>` : ""}
              <span class="due${urgent}">${esc(label)}</span>
            </div>
          </div>
          <div class="chev">›</div>
        </summary>
        <div class="details">
          <h3>Assignment Details</h3>
          <div class="desc">${esc(desc)}</div>
          ${link}
        </div>
      </details>`;
    }).join("");
  })
  .catch(err => {
    status.textContent = "";
    list.innerHTML = `<div class="error">${esc(err.message)}</div>`;
  });
</script>
</body>
</html>
